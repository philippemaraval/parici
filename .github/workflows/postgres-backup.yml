name: PostgreSQL backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parici-postgres-backup
  cancel-in-progress: false

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parici_restore
          POSTGRES_PASSWORD: parici_restore
          POSTGRES_USER: parici_restore
        options: >-
          --health-cmd "pg_isready -U parici_restore -d parici_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      CAMINO_RESTORE_ISOLATED: "1"
      BACKUP_DIR: backups
      BACKUP_RETENTION_DAYS: "30"
      RESTORE_DATABASE_URL: postgresql://parici_restore:parici_restore@localhost:5432/parici_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Verify required secrets
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Configurer PRODUCTION_DATABASE_URL"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "::error::Configurer BACKUP_ENCRYPTION_PASSPHRASE"; exit 1; }
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Create encrypted backup
        id: backup
        run: |
          backup_path="$(bash scripts/postgres_backup.sh)"
          echo "path=$backup_path" >> "$GITHUB_OUTPUT"
      - name: Restore into an ephemeral PostgreSQL instance
        id: restore
        run: bash scripts/postgres_restore_test.sh "${{ steps.backup.outputs.path }}"
      - name: Upload encrypted backup
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: parici-postgres-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.path }}
            ${{ steps.backup.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Enregistrer le résultat dans l’administration
        if: always()
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
          BACKUP_SUCCEEDED: ${{ steps.backup.outcome == 'success' }}
          RESTORE_SUCCEEDED: ${{ steps.restore.outcome == 'success' }}
          UPLOAD_SUCCEEDED: ${{ steps.upload.outcome == 'success' }}
        run: node scripts/record_backup_run.js
