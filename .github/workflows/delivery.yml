name: Delivery

on:
  workflow_run:
    workflows: ["Code quality"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: camino-delivery
  cancel-in-progress: false

jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.CAMINO_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Déployer la production avec retour arrière automatique
        env:
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
        run: node scripts/render_delivery.js
