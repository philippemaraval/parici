name: Operations monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync OSM Streets", "PostgreSQL backup"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: camino-operations-monitor
  cancel-in-progress: false

jobs:
  production-health:
    if: github.event_name != 'workflow_run' && vars.PRODUCTION_HEALTHCHECK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      MAX_HEALTH_LATENCY_MS: ${{ vars.MAX_HEALTH_LATENCY_MS || '2500' }}
      METRICS_URL: ${{ vars.PRODUCTION_METRICS_URL }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      MAX_API_ERRORS: ${{ vars.MAX_API_ERRORS || '50' }}
      MAX_CONNECTION_FAILURES: ${{ vars.MAX_CONNECTION_FAILURES || '20' }}
      MAX_PUSH_FAILURES: ${{ vars.MAX_PUSH_FAILURES || '10' }}
      MAX_OSM_SYNC_FAILURES: ${{ vars.MAX_OSM_SYNC_FAILURES || '2' }}
      MAX_DAILY_FAILURES: ${{ vars.MAX_DAILY_FAILURES || '10' }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check_production_health.js

  workflow-alert:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `[ops] ${run.name} en échec`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            if (!existing.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Le workflow **${run.name}** a échoué.\n\nRun: ${run.html_url}\nConclusion: ${run.conclusion}`,
              });
            }

  health-alert:
    needs: production-health
    if: always() && github.event_name != 'workflow_run' && needs.production-health.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '[ops] Santé production en échec';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            if (!existing.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Le contrôle de santé ou de latence a échoué.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
