name: Sync OSM Streets

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: "Source that requested the sync"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: sync-osm
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.OSM_SYNC_PR_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run OSM sync
        run: node scripts/sync_osm.js

      - name: Validate generated files
        run: npm run validate:osm

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet data/ backend/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No street data changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            ADDED=$(git diff --stat data/paris_rues_light.geojson | tail -1)
            echo "diff_summary=$ADDED" >> $GITHUB_OUTPUT
          fi

      - name: Commit synchronized data to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/paris_rues_light.geojson \
            data/paris_rues_enrichi.geojson \
            data/paris_arrondissements.geojson \
            data/paris_monuments.geojson \
            data/map_sync_meta.json \
            backend/data/paris_rues_light.geojson \
            backend/data/paris_arrondissements.geojson \
            backend/data/paris_monuments.geojson \
            backend/data/streets_index.json
          git commit -m "sync: update Paris street data from OSM"
          git pull --rebase origin main
          git push origin "HEAD:main"

      - name: Trigger Render deploy
        if: steps.check.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "No render deploy hook configured; skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
