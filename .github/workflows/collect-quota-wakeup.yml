name: Collect quota notification wakeup

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-quota-wakeup
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PARICI_API_URL: ${{ vars.PARICI_API_URL || 'https://parici.onrender.com' }}
    steps:
      - name: Wake API and process due quota notifications
        run: >
          curl --fail --silent --show-error --retry 5 --retry-all-errors
          --retry-delay 10 --connect-timeout 10 --max-time 60
          "$PARICI_API_URL/api/health?collect=1"
