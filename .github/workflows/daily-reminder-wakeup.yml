name: Daily reminder wakeup

on:
  schedule:
    # 10:00 and 16:00 in Paris: UTC shifts with daylight saving time.
    # All four runs are intentional; the database makes each reminder idempotent.
    - cron: "0 8,9,14,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-reminder-wakeup
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PARICI_API_URL: ${{ vars.PARICI_API_URL || 'https://camino-paris.onrender.com' }}
    steps:
      - name: Wake API and warm public caches
        run: >
          curl
          --fail
          --silent
          --show-error
          --retry 8
          --retry-all-errors
          --retry-delay 15
          --connect-timeout 10
          --max-time 60
          "$PARICI_API_URL/api/health?prewarm=1"

      - name: Wait for database readiness
        run: >
          curl
          --fail
          --silent
          --show-error
          --retry 8
          --retry-all-errors
          --retry-delay 15
          --connect-timeout 10
          --max-time 60
          "$PARICI_API_URL/api/ready"
