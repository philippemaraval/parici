<!DOCTYPE html>
<html lang="fr">

<head>
  <script src="/src/public/js/runtime-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demandez un lien de réinitialisation de votre mot de passe Parici.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" sizes="32x32" href="/camino-paris-favicon.ico/icon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Mot de passe oublié | Parici</title>
  <style>
    :root {
      font-family: "Nunito", system-ui, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #fefbf5 0%, #eef3ff 100%);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid rgba(18, 41, 122, 0.16);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 40px rgba(12, 29, 87, 0.14);
    }

    h1 { margin: 0 0 8px; color: #0c1d57; font-size: 26px; }
    p { margin: 0 0 20px; color: #64748b; line-height: 1.5; }
    label { display: block; margin: 14px 0 5px; font-weight: 700; font-size: 13px; }

    input,
    button {
      width: 100%;
      min-height: 44px;
      border-radius: 9px;
      font: inherit;
    }

    input { padding: 10px 12px; border: 1px solid #cbd5e1; }
    input:focus { outline: 3px solid rgba(64, 87, 178, 0.2); border-color: #4057b2; }

    button {
      margin-top: 20px;
      border: 0;
      background: #12297a;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled { opacity: 0.65; cursor: wait; }
    #status { min-height: 24px; margin: 16px 0 0; font-size: 14px; font-weight: 700; }
    .error { color: #a72c25; }
    .success { color: #14734c; }
    .back-link { display: inline-block; margin-top: 18px; color: #12297a; font-weight: 700; }
    .privacy-note { margin: 8px 0 0; font-size: 12px; }
    .privacy-note a { color: #12297a; font-weight: 700; }
  </style>
</head>

<body>
  <main>
    <h1>Mot de passe oublié</h1>
    <p>Renseignez votre pseudo et l’adresse mail de récupération associée à votre compte.</p>

    <form id="request-form">
      <label for="username">Pseudo</label>
      <input id="username" type="text" maxlength="160" autocomplete="username" required>

      <label for="recovery-email">Mail de récupération</label>
      <input id="recovery-email" type="email" maxlength="254" autocomplete="email" required>
      <p class="privacy-note">
        Cette adresse sert uniquement à vérifier votre demande et à envoyer le lien de réinitialisation.
        <a href="/confidentialite.html">En savoir plus</a>
      </p>

      <button id="submit-button" type="submit">Recevoir le lien</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <a class="back-link" href="/?view=profile#profile">Retour à la connexion</a>
  </main>

  <script>
    (() => {
      const API_URL =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
          ? "http://localhost:3000"
          : "https://camino-paris.onrender.com";
      const form = document.getElementById("request-form");
      const status = document.getElementById("status");
      const submitButton = document.getElementById("submit-button");

      function showStatus(message, type) {
        status.textContent = message;
        status.className = type || "";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        showStatus("Envoi en cours…");
        try {
          const response = await fetch(`${API_URL}/api/password-reset/request`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              recoveryEmail: document.getElementById("recovery-email").value.trim().toLowerCase(),
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (response.status === 429) {
            throw new Error("Trop de demandes ont été effectuées. Réessayez dans quelques minutes.");
          }
          if (!response.ok) {
            throw new Error(payload.error || "Impossible d’effectuer la demande.");
          }
          form.hidden = true;
          showStatus(
            "Si ces informations correspondent à un compte, un e-mail contenant le lien a été envoyé.",
            "success",
          );
        } catch (error) {
          showStatus(error.message || "Le serveur est momentanément indisponible.", "error");
          submitButton.disabled = false;
        }
      });
    })();
  </script>
</body>

</html>
