<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Camino Paris - Nouveau mot de passe</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260627-ios">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png?v=20260627-ios">
  <link rel="manifest" href="/site.webmanifest?v=20260627-ios">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Camino Paris">
  <style>
    :root {
      font-family: "Nunito", system-ui, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #fefbf5 0%, #eef3ff 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid rgba(18, 41, 122, 0.16);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 40px rgba(12, 29, 87, 0.14);
    }

    h1 {
      margin: 0 0 8px;
      color: #0c1d57;
      font-size: 26px;
    }

    p {
      margin: 0 0 20px;
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 5px;
      font-weight: 700;
      font-size: 13px;
    }

    input,
    button {
      width: 100%;
      min-height: 44px;
      border-radius: 9px;
      font: inherit;
    }

    input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
    }

    input:focus {
      outline: 3px solid rgba(64, 87, 178, 0.2);
      border-color: #4057b2;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #12297a;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin: 16px 0 0;
      font-size: 14px;
      font-weight: 700;
    }

    .error {
      color: #a72c25;
    }

    .success {
      color: #14734c;
    }

    a {
      color: #12297a;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>Nouveau mot de passe</h1>
    <p>Choisissez un nouveau mot de passe pour votre compte Camino. Ce lien ne fonctionnera qu’une seule fois.</p>

    <form id="reset-form">
      <label for="password">Nouveau mot de passe</label>
      <input id="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>

      <label for="password-confirmation">Confirmer le mot de passe</label>
      <input id="password-confirmation" type="password" minlength="8" maxlength="200" autocomplete="new-password"
        required>

      <button id="submit-button" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      const API_URL =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
          ? "http://localhost:3000"
          : "https://camino-paris.onrender.com";
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";
      const form = document.getElementById("reset-form");
      const status = document.getElementById("status");
      const submitButton = document.getElementById("submit-button");

      history.replaceState(null, "", window.location.pathname);

      function showStatus(message, type) {
        status.textContent = message;
        status.className = type || "";
      }

      if (!token) {
        form.hidden = true;
        showStatus("Ce lien de réinitialisation est incomplet.", "error");
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirmation = document.getElementById("password-confirmation").value;
        if (password !== confirmation) {
          showStatus("Les deux mots de passe ne correspondent pas.", "error");
          return;
        }

        submitButton.disabled = true;
        showStatus("Enregistrement en cours…");
        try {
          const response = await fetch(`${API_URL}/api/password-reset`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || "Impossible de réinitialiser le mot de passe.");
          }
          form.hidden = true;
          status.innerHTML = 'Mot de passe modifié. Vous pouvez maintenant <a href="/">vous connecter à Camino</a>.';
          status.className = "success";
        } catch (error) {
          showStatus(
            error.message === "Invalid or expired reset link"
              ? "Ce lien a expiré ou a déjà été utilisé."
              : error.message,
            "error",
          );
          submitButton.disabled = false;
        }
      });
    })();
  </script>
</body>

</html>
