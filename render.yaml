services:
  - type: web
    name: camino-paris
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    # backend/package.json is a lock-free launcher. Its postinstall command
    # installs from the repository root lockfile and builds the frontend.
    buildCommand: npm run postinstall
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://parici.netlify.app
      - key: PASSWORD_RESET_FRONTEND_URL
        value: https://parici.netlify.app
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ENABLE_ADMIN_ROUTES
        value: "false"
      - key: VAPID_SUBJECT
        value: mailto:noreply@camino-paris.app
      - key: PUSH_REMINDER_HOUR
        value: "10"
      - key: PUSH_REMINDER_MINUTE
        value: "0"
      - key: PUSH_STREAK_REMINDER_HOUR
        value: "16"
      - key: PUSH_STREAK_REMINDER_MINUTE
        value: "0"
      - key: PUSH_REMINDER_TIMEZONE
        value: Europe/Paris
